version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Welcome@123
    volumes:
      - sqlserver-data:/var/opt/mssql

  influxdb:
    image: influxdb:1.8
    container_name: influxdb1.8
    ports:
      - "8086:8086"
    volumes:
      - influxdb2-data:/var/lib/influxdb2
      - influxdb2-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=harish
      - DOCKER_INFLUXDB_INIT_PASSWORD=Harish
      - DOCKER_INFLUXDB_INIT_ORG=harish
      - DOCKER_INFLUXDB_INIT_BUCKET=harish

  mongodb:
    image: mongo:4.4
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    volumes:
      - mongodb-data:/data/db

volumes:
  sqlserver-data:
  influxdb2-data:
  influxdb2-config:
  mongodb-data:


